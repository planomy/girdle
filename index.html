<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>girdle - the word grid game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lexend', sans-serif;
            touch-action: manipulation;
            user-select: none;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .grid-cell {
            aspect-ratio: 1 / 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .swiping-active {
            background-color: #38bdf8 !important;
            color: #0f172a !important;
            transform: scale(0.92);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            z-index: 10;
        }
        .word-item {
            animation: popIn 0.2s ease-out;
            font-size: 0.75rem;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4 overflow-x-hidden">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-end mb-6 px-1">
        <div>
            <h1 class="text-5xl font-800 tracking-tighter text-sky-400 leading-none lowercase">girdle</h1>
            <p class="text-[10px] uppercase tracking-[0.3em] text-sky-800 font-bold mt-1">the grid game</p>
        </div>
        <div class="text-right">
            <div id="score-display" class="text-4xl font-800 text-white leading-none">0</div>
            <div id="deduction-display" class="text-[9px] font-extrabold text-rose-500 bg-rose-500/10 px-2 py-0.5 rounded-full uppercase mt-1">Switches: 0</div>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-md flex flex-col gap-4">
        
        <div id="status-msg" class="bg-slate-800/40 p-3 rounded-2xl text-center text-xs font-semibold border border-slate-700/30 text-slate-300">
            Tap a cell to place the letter.
        </div>

        <!-- Next Letter -->
        <div id="next-letter-container" class="flex items-center justify-center gap-6 py-2">
            <div class="text-right">
                <p class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">Up Next</p>
                <p id="remaining-count" class="text-xs font-bold text-sky-500">16 left</p>
            </div>
            <div id="next-letter" class="w-20 h-20 bg-sky-500 rounded-3xl flex items-center justify-center text-4xl font-800 shadow-xl shadow-sky-900/30 border-b-4 border-sky-700 text-slate-900 transition-all">
                -
            </div>
        </div>

        <!-- The 4x4 Grid -->
        <div id="game-grid" class="grid grid-cols-4 gap-3 bg-slate-900 p-4 rounded-[2.5rem] shadow-2xl relative border border-slate-800/50">
            <!-- JS populated -->
        </div>

        <div id="controls" class="flex flex-col gap-3">
            <button id="main-action-btn" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-800 disabled:text-slate-600 rounded-2xl font-800 text-lg transition-all shadow-lg active:scale-95 text-slate-950">
                READY...
            </button>
            <p id="sub-msg" class="text-center text-[11px] text-slate-500 px-8 leading-relaxed"></p>
        </div>

        <!-- Words Found (4 Narrow Columns) -->
        <div id="word-discovery" class="hidden flex flex-col gap-2">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-slate-500 text-[10px] font-extrabold uppercase tracking-widest">Found Words</h3>
                <span id="word-count-badge" class="text-sky-500 text-[10px] font-bold bg-sky-500/10 px-2 py-0.5 rounded-full">0</span>
            </div>
            <div id="word-columns" class="grid grid-cols-4 gap-1.5 max-h-44 overflow-y-auto pr-1 custom-scrollbar">
                <!-- Words go here -->
            </div>
        </div>
    </main>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-xl hidden items-center justify-center p-6 z-50">
        <div class="bg-slate-900 w-full max-w-sm rounded-[3rem] p-10 border border-slate-800 shadow-2xl flex flex-col items-center gap-8 text-center">
            <div>
                <h2 class="text-5xl font-800 text-sky-400 tracking-tighter lowercase">girdle</h2>
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-[0.4em]">Final Result</p>
            </div>
            
            <div class="flex flex-col items-center">
                <span class="text-8xl font-800 tracking-tighter text-white" id="final-score">0</span>
                <span class="text-slate-400 uppercase tracking-widest text-[11px] font-extrabold mt-2">Total Points</span>
            </div>

            <div class="w-full space-y-4 border-y border-slate-800 py-8">
                <div class="flex justify-between text-sm font-bold">
                    <span class="text-slate-500 uppercase">Words Found</span>
                    <span id="stat-word-count" class="text-white">0</span>
                </div>
                <div class="flex justify-between text-sm font-bold">
                    <span class="text-slate-500 uppercase">Word Points</span>
                    <span id="stat-word-pts" class="text-emerald-400">+0</span>
                </div>
                <div class="flex justify-between text-sm font-bold">
                    <span class="text-slate-500 uppercase">Switch Cost</span>
                    <span id="stat-deduction" class="text-rose-400">-0</span>
                </div>
            </div>

            <button id="share-btn" class="w-full py-5 bg-sky-500 hover:bg-sky-400 rounded-[1.5rem] font-800 text-slate-950 flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 text-lg uppercase">
                Copy Results
            </button>
            <button onclick="location.reload()" class="text-slate-500 text-xs font-bold uppercase tracking-widest hover:text-white transition-colors">New Game</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-slate-950 px-8 py-3 rounded-full font-800 shadow-2xl opacity-0 transition-all pointer-events-none z-50 text-sm">
        Results copied!
    </div>

    <script>
        const PHASES = { PLACE: 0, REARRANGE: 1, SWIPE: 2, RESULT: 3 };
        let currentPhase = PHASES.PLACE;
        let grid = Array(16).fill(null);
        let lettersToPlace = [];
        let placementIndex = 0;
        let switches = 0;
        let wordScore = 0;
        let foundWords = [];
        let swapStartIdx = null;
        
        let isSwiping = false;
        let currentSwipePath = [];
        let swipeWord = "";

        const DICTIONARY = new Set();
        async function loadDictionary() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_dictionary.json');
                const data = await response.json();
                Object.keys(data).forEach(word => {
                    if (word.length >= 3 && word.length <= 10) DICTIONARY.add(word.toUpperCase());
                });
            } catch (e) {
                ["THE","AND","YOU","ARE","FOR","GET","WAS","HAD","WIN","POP","GRID"].forEach(w => DICTIONARY.add(w));
            }
        }

        /**
         * INTELLIGENT LETTER GENERATOR
         * - Prevents vowel clusters
         * - Pairs Q with U
         * - Limits rare letters
         */
        function generateLetterSet() {
            const vPool = "AEIOU".split("");
            const vWeights = [9, 12, 9, 8, 4];
            
            const cPool = "BCDFGHJKLMNPQRSTVWXYZ".split("");
            const cWeights = [2, 2, 4, 2, 3, 2, 1, 4, 8, 2, 6, 6, 2, 1, 6, 4, 6, 2, 2, 1, 2, 1];

            function getRandomFromPool(pool, weights) {
                const total = weights.reduce((a, b) => a + b, 0);
                let random = Math.floor(Math.random() * total);
                for (let i = 0; i < pool.length; i++) {
                    if (random < weights[i]) return pool[i];
                    random -= weights[i];
                }
                return pool[0];
            }

            let result = [];
            const vowelTarget = Math.random() > 0.5 ? 5 : 6;
            
            // Draw Vowels
            for (let i = 0; i < vowelTarget; i++) {
                result.push(getRandomFromPool(vPool, vWeights));
            }
            
            // Draw Consonants
            for (let i = 0; i < (16 - vowelTarget); i++) {
                result.push(getRandomFromPool(cPool, cWeights));
            }

            // Shuffle initial draw
            result.sort(() => Math.random() - 0.5);

            // INTELLIGENCE PASS: Pair Q with U
            const qIndex = result.indexOf('Q');
            if (qIndex !== -1) {
                // Ensure there's a U
                if (!result.includes('U')) {
                    const replaceIdx = result.findIndex(l => l !== 'Q' && "AEIO".includes(l));
                    if (replaceIdx !== -1) result[replaceIdx] = 'U';
                }
                
                // Position U right after Q in the placement queue
                const filtered = result.filter(l => l !== 'Q' && l !== 'U');
                const insertAt = Math.floor(Math.random() * (filtered.length - 1));
                filtered.splice(insertAt, 0, 'Q', 'U');
                result = filtered;
            }

            return result.slice(0, 16);
        }

        function updateUI() {
            const status = document.getElementById('status-msg');
            const btn = document.getElementById('main-action-btn');
            const scoreDisp = document.getElementById('score-display');
            const deductionDisp = document.getElementById('deduction-display');
            const subMsg = document.getElementById('sub-msg');
            const remCount = document.getElementById('remaining-count');

            scoreDisp.innerText = Math.max(0, wordScore - switches);
            deductionDisp.innerText = `Switches: ${switches}`;
            remCount.innerText = `${16 - placementIndex} left`;

            if (currentPhase === PHASES.PLACE) {
                status.innerText = "Tap a cell to place the next letter.";
                btn.disabled = placementIndex < 16;
                btn.innerText = placementIndex < 16 ? "PLACING..." : "START REARRANGING";
                subMsg.innerText = "Tip: Try to keep common consonants near vowels.";
            } else if (currentPhase === PHASES.REARRANGE) {
                status.innerText = "Swap letters for 1 point each.";
                btn.disabled = false;
                btn.innerText = "LOCK IN GRID";
                document.getElementById('next-letter-container').classList.add('hidden');
                subMsg.innerText = "Fix your grid. Every swap reduces your final score by 1.";
            } else if (currentPhase === PHASES.SWIPE) {
                status.innerText = "Swipe over letters to find words.";
                btn.disabled = false;
                btn.innerText = "FINISH GAME";
                document.getElementById('word-discovery').classList.remove('hidden');
                subMsg.innerText = "Diagonals are allowed! 3=1pt, 4=2pts, 5+=3pts.";
            }
        }

        function createGrid() {
            const container = document.getElementById('game-grid');
            container.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell bg-slate-800 rounded-2xl flex items-center justify-center text-3xl font-800 cursor-pointer hover:bg-slate-700 select-none touch-none transition-all border-b-4 border-slate-950 shadow-inner text-slate-100';
                cell.id = `cell-${i}`;
                cell.dataset.index = i;
                
                cell.addEventListener('mousedown', (e) => handleCellInteraction(i, 'start'));
                cell.addEventListener('mouseenter', (e) => handleCellInteraction(i, 'move'));
                cell.addEventListener('touchstart', (e) => { e.preventDefault(); handleCellInteraction(i, 'start'); });
                
                container.appendChild(cell);
            }

            window.addEventListener('mouseup', () => handleCellInteraction(null, 'end'));
            container.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (element && element.classList.contains('grid-cell')) {
                    handleCellInteraction(parseInt(element.dataset.index), 'move');
                }
            });
            window.addEventListener('touchend', () => handleCellInteraction(null, 'end'));
        }

        function renderGrid() {
            grid.forEach((letter, i) => {
                const cell = document.getElementById(`cell-${i}`);
                cell.innerText = letter || '';
                cell.classList.remove('bg-sky-500', 'bg-slate-800', 'bg-slate-700', 'border-sky-300', 'swiping-active', 'scale-90', 'border-b-sky-700', 'text-slate-900');
                
                if (currentPhase === PHASES.SWIPE) {
                    if (currentSwipePath.includes(i)) cell.classList.add('swiping-active');
                    else cell.classList.add('bg-slate-800');
                } else if (currentPhase === PHASES.REARRANGE) {
                    if (swapStartIdx === i) cell.classList.add('border-sky-300', 'bg-sky-500', 'border-b-sky-700', 'scale-90', 'text-slate-900');
                    else cell.classList.add('bg-slate-800');
                } else {
                    cell.classList.add(letter ? 'bg-slate-700' : 'bg-slate-800');
                }
            });
        }

        function handleCellInteraction(idx, type) {
            if (currentPhase === PHASES.PLACE) {
                if (type === 'start' && idx !== null && grid[idx] === null && placementIndex < 16) {
                    grid[idx] = lettersToPlace[placementIndex];
                    placementIndex++;
                    if (placementIndex < 16) document.getElementById('next-letter').innerText = lettersToPlace[placementIndex];
                    else document.getElementById('next-letter').innerText = '✓';
                    renderGrid();
                    updateUI();
                }
            } else if (currentPhase === PHASES.REARRANGE) {
                if (type === 'start' && idx !== null) {
                    if (swapStartIdx === null) swapStartIdx = idx;
                    else if (swapStartIdx === idx) swapStartIdx = null;
                    else {
                        const temp = grid[idx];
                        grid[idx] = grid[swapStartIdx];
                        grid[swapStartIdx] = temp;
                        switches++;
                        swapStartIdx = null;
                    }
                    renderGrid();
                    updateUI();
                }
            } else if (currentPhase === PHASES.SWIPE) {
                if (type === 'start' && idx !== null) {
                    isSwiping = true;
                    currentSwipePath = [idx];
                    swipeWord = grid[idx];
                    renderGrid();
                } else if (type === 'move' && isSwiping && idx !== null) {
                    if (!currentSwipePath.includes(idx) && isAdjacent(currentSwipePath[currentSwipePath.length - 1], idx)) {
                        currentSwipePath.push(idx);
                        swipeWord += grid[idx];
                        renderGrid();
                    }
                } else if (type === 'end' && isSwiping) {
                    processSwipe();
                    isSwiping = false;
                    currentSwipePath = [];
                    swipeWord = "";
                    renderGrid();
                }
            }
        }

        function isAdjacent(idx1, idx2) {
            const r1 = Math.floor(idx1 / 4), c1 = idx1 % 4;
            const r2 = Math.floor(idx2 / 4), c2 = idx2 % 4;
            return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1;
        }

        function processSwipe() {
            if (swipeWord.length < 3) return;
            if (foundWords.includes(swipeWord)) return;
            if (DICTIONARY.has(swipeWord)) {
                foundWords.push(swipeWord);
                const points = swipeWord.length === 3 ? 1 : swipeWord.length === 4 ? 2 : 3;
                wordScore += points;
                addWordToUI(swipeWord);
                updateUI();
                document.getElementById('word-count-badge').innerText = foundWords.length;
            }
        }

        function addWordToUI(word) {
            const col = document.getElementById('word-columns');
            const div = document.createElement('div');
            div.className = 'word-item bg-slate-800/80 px-1 py-1 rounded border border-slate-700/50 text-center font-bold text-sky-400 truncate uppercase';
            div.innerText = word;
            col.prepend(div);
        }

        function handleMainAction() {
            if (currentPhase === PHASES.PLACE) currentPhase = PHASES.REARRANGE;
            else if (currentPhase === PHASES.REARRANGE) currentPhase = PHASES.SWIPE;
            else if (currentPhase === PHASES.SWIPE) showResults();
            renderGrid();
            updateUI();
        }

        function showResults() {
            currentPhase = PHASES.RESULT;
            document.getElementById('result-modal').classList.remove('hidden');
            document.getElementById('result-modal').classList.add('flex');
            const final = Math.max(0, wordScore - switches);
            document.getElementById('final-score').innerText = final;
            document.getElementById('stat-word-count').innerText = foundWords.length;
            document.getElementById('stat-word-pts').innerText = `+${wordScore}`;
            document.getElementById('stat-deduction').innerText = `-${switches}`;
        }

        function copyResults() {
            let gridVisual = "";
            for(let i=0; i<16; i++) {
                gridVisual += `[${grid[i]}] `;
                if((i+1) % 4 === 0) gridVisual += "\n";
            }
            
            const wordsList = foundWords.join(", ");
            const shareText = `girdle 🫧\nScore: ${Math.max(0, wordScore - switches)}\nWords: ${foundWords.length}\nSwitches: ${switches}\n\n${gridVisual}\nFound: ${wordsList}\n\n🔥 beat my score!`;
            
            const el = document.createElement('textarea');
            el.value = shareText;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);

            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        window.onload = async () => {
            await loadDictionary();
            lettersToPlace = generateLetterSet();
            document.getElementById('next-letter').innerText = lettersToPlace[0];
            createGrid();
            updateUI();
            document.getElementById('main-action-btn').addEventListener('click', handleMainAction);
            document.getElementById('share-btn').addEventListener('click', copyResults);
        }
    </script>
</body>
</html>
